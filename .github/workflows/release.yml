name: Release

# Po wypchnieciu tagu wersji (np. v1.0.0) buduje paczki i tworzy GitHub Release.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build packages (zip + exe)
        shell: powershell
        run: ./build/Build-Package.ps1 -Version "${{ github.ref_name }}" -WithExe

      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/*.zip dist/SHA256SUMS.txt \
            --title "${{ github.ref_name }}" --generate-notes
